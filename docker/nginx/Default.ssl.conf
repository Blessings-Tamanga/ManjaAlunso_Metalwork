upstream php_app {
    server app:9000;
}

# Redirect HTTP to HTTPS (Production)
# Uncomment for production with SSL certificates
# server {
#     listen 80;
#     server_name your-domain.com www.your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

# Main server block (HTTP for development, or HTTPS for production)
server {
    listen 80;
    # Uncomment for HTTPS in production
    # listen 443 ssl http2;
    
    server_name manjaalunso.test localhost;
    root /var/www/html/public;

    # SSL Configuration (for production with certificates)
    # ssl_certificate /etc/nginx/certs/your-domain.com.crt;
    # ssl_certificate_key /etc/nginx/certs/your-domain.com.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Client upload size limit
    client_max_body_size 50M;

    # Index files
    index index.php index.html;

    # Character encoding
    charset utf-8;

    # Logging (redirect to Docker's logging system)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Disable logging for favicon and robots.txt
    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }
    
    location = /robots.txt  { 
        access_log off; 
        log_not_found off; 
    }

    # Main application routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Configuration
    location ~ \.php$ {
        fastcgi_pass php_app;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/log/nginx/php_errors.log";
        fastcgi_param PHP_ADMIN_VALUE "error_log=/var/log/nginx/php_errors.log";
        
        include fastcgi_params;
        include fastcgi.conf;
        
        fastcgi_hide_header X-Powered-By;
        
        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        
        # Buffering
        fastcgi_buffering on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Handle errors
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Deny access to specific directories
    location ~ ^/(vendor|storage|bootstrap|\.env|\.git) {
        deny all;
    }

    # Static file caching (1 year)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Pragma "public" always;
        access_log off;
    }

    # Cache manifest
    location ~* \.(?:manifest|appcache)$ {
        expires 0;
        add_header Cache-Control "must-revalidate";
    }

    # WebFont loading
    location ~ \.(ttf|ttc|otf|eot|woff|woff2)$ {
        add_header Access-Control-Allow-Origin "*";
        expires 1y;
    }

    # Performance: deny access to backup/version control files
    location ~ ~$ { deny all; }
    location ~ \.bak$ { deny all; }
    location ~ \.sql$ { deny all; }
